# Generates Daily.xcodeproj — run `xcodegen generate` (see README).
name: Daily

options:
  bundleIdPrefix: com.daily
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # Set your Apple Developer Team ID here to run on a device.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO
    TARGETED_DEVICE_FAMILY: "1"

targets:

  Daily:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: Daily
        PRODUCT_BUNDLE_IDENTIFIER: com.daily.schedule
        INFOPLIST_FILE: App/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Resources/Daily.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
    dependencies:
      - target: DailyWidget

  DailyWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: DailyWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.daily.schedule.DailyWidget
        INFOPLIST_FILE: Widget/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widget/Resources/DailyWidget.entitlements
        ENABLE_PREVIEWS: YES
